<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台股五日強弱分析全量儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .stock-table th { background-color: #1e293b; color: #ffffff; position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
        .stock-table th:hover { background-color: #334155; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; font-weight: 700; }
        .sort-icon { display: inline-block; margin-left: 4px; font-size: 0.75rem; color: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- 頂部頁籤區 (RWD 適應) -->
    <header class="bg-slate-900 text-white p-4 sm:p-5 shadow-md">
        <div class="max-w-[98%] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-xl sm:text-2xl font-black tracking-tight">📈 台股五日強弱分析儀表板</h1>
                <p class="text-sm sm:text-base text-slate-200 mt-1 font-semibold">凡爸邏輯（含 ETF ）</p>
            </div>

            <!-- 右上角：指標標籤 + 統計 + 日期選擇器 -->
            <div class="flex flex-wrap items-center justify-center sm:justify-end gap-2 sm:gap-3 w-full lg:w-auto">
                <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs text-emerald-400 font-bold shadow-sm">
                    <span>⚡ 5 大技術指標</span>
                </div>

                <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs text-blue-300 font-bold shadow-sm">
                    <span>📊 共 <span id="header-total-count" class="text-white font-extrabold text-sm">0</span> 檔</span>
                </div>

                <div class="h-6 w-[1px] bg-slate-700 hidden sm:block"></div>

                <!-- 日期切換 -->
                <div class="flex items-center gap-2">
                    <label class="text-xs sm:text-sm font-bold text-blue-300">📅 切換日期：</label>
                    <select id="dateSelect" onchange="changeDate(this.value)" class="bg-slate-800 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="2026/11/04">2026/11/04</option><option value="2026/11/03">2026/11/03</option><option value="2026/11/02">2026/11/02</option><option value="2026/10/30">2026/10/30</option><option value="2026/10/29">2026/10/29</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[98%] mx-auto px-2 sm:px-4 py-4 sm:py-6 flex-grow w-full">
        <div class="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-xl text-xs sm:text-sm mb-5 flex items-center gap-2 shadow-sm">
            <span class="text-base">💡</span>
            <span><strong>篩選說明：</strong>已剔除成交金額 < 5 億元的標的。</span>
        </div>
        
        <!-- 統計數據卡片 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-5">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500">當前篩選檔數</p>
                <p id="stat-count" class="text-xl sm:text-2xl font-black mt-1 text-slate-800">0</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500">平均漲跌幅</p>
                <p id="stat-avg-change" class="text-xl sm:text-2xl font-black mt-1">0.00%</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500">總成交金額(億)</p>
                <p id="stat-total-amount" class="text-xl sm:text-2xl font-black text-blue-600 mt-1">0.00</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500">上市 / 上櫃分佈</p>
                <p id="stat-market-dist" class="text-sm sm:text-lg font-bold mt-1 text-slate-700">-</p>
            </div>
        </div>

        <!-- 搜尋與過濾列 -->
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 mb-5 flex flex-col sm:flex-row justify-between items-center gap-3">
            <input type="text" id="searchInput" placeholder="🔍 搜尋代號、名稱、概念股..." class="w-full sm:w-80 px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex w-full sm:w-auto justify-stretch sm:justify-end gap-2" id="market-btn-group">
                <button onclick="setMarketFilter('all')" id="btn-mkt-all" class="flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-blue-600 text-white transition">全部</button>
                <button onclick="setMarketFilter('上市')" id="btn-mkt-上市" class="flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">上市</button>
                <button onclick="setMarketFilter('上櫃')" id="btn-mkt-上櫃" class="flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">上櫃</button>
            </div>
        </div>

        <!-- 分頁標籤 -->
        <div class="flex overflow-x-auto custom-scrollbar gap-2 mb-4 pb-1" id="tab-container"></div>

        <!-- 表格容器 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar max-h-[65vh] sm:max-h-[700px]">
                <table class="w-full text-left border-collapse stock-table text-xs sm:text-sm whitespace-nowrap">
                    <thead>
                        <tr>
                            <th onclick="sortTable('市場別')" class="px-3 py-3">市場<span class="sort-icon" id="sort-市場別">↕</span></th>
                            <th onclick="sortTable('證券代號')" class="px-3 py-3">代號<span class="sort-icon" id="sort-證券代號">↕</span></th>
                            <th onclick="sortTable('證券名稱')" class="px-3 py-3">名稱<span class="sort-icon" id="sort-證券名稱">↕</span></th>
                            <th onclick="sortTable('收盤價')" class="px-3 py-3 text-right">收盤價<span class="sort-icon" id="sort-收盤價">↕</span></th>
                            <th onclick="sortTable('漲跌幅')" class="px-3 py-3 text-right">漲跌幅<span class="sort-icon" id="sort-漲跌幅">↕</span></th>
                            <th onclick="sortTable('成交金額(億元)')" class="px-3 py-3 text-right">成交額(億)<span class="sort-icon" id="sort-成交金額(億元)">↕</span></th>
                            <th onclick="sortTable('最高價')" class="px-3 py-3 text-right">最高價<span class="sort-icon" id="sort-最高價">↕</span></th>
                            <th onclick="sortTable('最低價')" class="px-3 py-3 text-right">最低價<span class="sort-icon" id="sort-最低價">↕</span></th>
                            <th onclick="sortTable('五日最高價')" class="px-3 py-3 text-right">5日最高<span class="sort-icon" id="sort-五日最高價">↕</span></th>
                            <th onclick="sortTable('五日最低價')" class="px-3 py-3 text-right">5日最低<span class="sort-icon" id="sort-五日最低價">↕</span></th>
                            <th onclick="sortTable('主要概念股')" class="px-3 py-3">主要概念股<span class="sort-icon" id="sort-主要概念股">↕</span></th>
                            <th onclick="sortTable('次要概念股')" class="px-3 py-3">次要概念股<span class="sort-icon" id="sort-次要概念股">↕</span></th>
                            <th class="px-3 py-3 text-center">K線圖</th>
                        </tr>
                    </thead>
                    <tbody id="stock-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- K線圖彈出視窗 Modal -->
    <div id="chartModal" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden border border-slate-200">
            <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📊</span>
                    <div>
                        <h3 id="modalStockTitle" class="text-xl font-black tracking-wide">股票名稱與代號</h3>
                        <p class="text-xs text-slate-400 font-medium">技術線圖查看指引</p>
                    </div>
                </div>
                <button onclick="closeChartModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg p-2 transition focus:outline-none">
                    ✕ 關閉視窗
                </button>
            </div>
            <div class="p-6 sm:p-8 bg-slate-50 flex flex-col items-center justify-center text-center gap-6">
                <div class="bg-blue-50 border border-blue-200 rounded-2xl p-5 sm:p-6 w-full">
                    <h4 class="text-base sm:text-lg font-bold text-slate-800 mb-2">請選擇您習慣的 K 線圖看盤來源</h4>
                    <p class="text-xs sm:text-sm text-slate-600 mb-6">點擊下方按鈕可直接跳轉至第三方看盤頁面：</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <a id="yahooChartBtn" href="#" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-3 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 text-sm sm:text-base cursor-pointer">
                            📈 Yahoo 股市
                        </a>
                        <a id="tvChartBtn" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-3 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 text-sm sm:text-base cursor-pointer">
                            📊 TradingView
                        </a>
                        <a id="pchomeChartBtn" href="#" target="_blank" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-3 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 text-sm sm:text-base cursor-pointer">
                            📉 PChome 股市
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

            if (num < 0) return `${num.toFixed(2)}%`;
            return '0.00%';

                    if (type === m) {

                    }
                }
            });
            renderTable();
        }

        function sortTable(col) {
            if (currentSortCol === col) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortCol = col;
                currentSortAsc = true;
            }
            renderTable();
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            container.innerHTML = '';
            Object.keys(stockData).forEach(s => {
                const btn = document.createElement('button');
                btn.className = `tab-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs sm:text-sm border transition ${s === currentTab ? 'active bg-blue-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-100'}`;
                btn.innerText = s;
                btn.onclick = () => { 
                    currentTab = s; 
                    currentSortCol = ''; 
                    renderTabs(); 
                    renderTable(); 
                };
                container.appendChild(btn);
            });

        function renderTable() {

            document.getElementById('header-total-count').innerText = rawData.length;

            if (marketFilter !== 'all') {
                data = data.filter(i => i['市場別'] === marketFilter);
            }
            
            const q = document.getElementById('searchInput').value.toLowerCase().trim();

                data = data.filter(i =>

            }

                    <td class="px-3 py-2 text-right font-mono text-slate-400">${Number(item['五日最高價']||0).toFixed(2)}</td>
                    <td class="px-3 py-2 text-right font-mono text-slate-400">${Number(item['五日最低價']||0).toFixed(2)}</td>
                    <td class="px-3 py-2 text-xs"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200">${item['主要概念股']}</span></td>
                    <td class="px-3 py-2 text-xs text-slate-500">${item['次要概念股']}</td>
                    <td class="px-3 py-2 text-center">
                        <button onclick="openChartModal('${item['證券代號']}', '${item['證券名稱']}', '${item['市場別']}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-2.5 py-1 rounded-md font-bold text-xs transition inline-flex items-center gap-1">
                            📈 查看K線
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // K線圖彈窗邏輯（包含 Yahoo、TradingView 與 PChome 股市）
        function openChartModal(code, name, market) {
            document.getElementById('modalStockTitle').innerText = `${name} (${code})`;
            
            // Yahoo 股市連結
            const yahooUrl = `https://tw.stock.yahoo.com/quote/${code}.TW`;
            
            // TradingView 連結（依據市場別自動切換 TWSE 或 TPEX）
            const exchange = (market === '上櫃') ? 'TPEX' : 'TWSE';
            const tvUrl = `https://tw.tradingview.com/chart/?symbol=${exchange}%3A${code}`;

            // PChome 股市連結
            const pchomeUrl = `https://pchome.megatime.com.tw/stock/sto0/ock1/sid${code}.html`;
            
            document.getElementById('yahooChartBtn').href = yahooUrl;
            document.getElementById('tvChartBtn').href = tvUrl;
            document.getElementById('pchomeChartBtn').href = pchomeUrl;
            
            document.getElementById('chartModal').classList.remove('hidden');
        }

        function closeChartModal() {
            document.getElementById('chartModal').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', renderTable);
        window.onload = () => { renderTabs(); renderTable(); };
    </script>
</body>
</html>
